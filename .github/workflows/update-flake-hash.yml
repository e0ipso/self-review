name: Update flake hash

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
        type: string

jobs:
  update:
    name: Update flake.nix hash for new release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the hash updater
        run: bash scripts/test/update-flake-hash.test.sh

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Install the unpacked source hash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          declared=$(jq -r .version package.json)
          if [ "$version" != "$declared" ]; then
            echo "flake.nix tracks package.json version $declared, not $version" >&2
            exit 1
          fi
          bash scripts/update-flake-hash.sh x86_64-linux

      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update flake hash for ${{ inputs.tag }}"
          title: "chore: update flake hash for ${{ inputs.tag }}"
          body: |
            Automated update of the `flake.nix` unpacked source hash for release
            ${{ inputs.tag }}, verified by building the fetchzip source.
          branch: flake-hash-${{ inputs.tag }}
          labels: dependencies

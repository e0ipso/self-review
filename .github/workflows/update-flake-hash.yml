name: Update flake hash

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
        type: string

jobs:
  update:
    name: Update flake.nix hash for new release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the hash updater
        run: bash scripts/test/update-flake-hash.test.sh

      # The updater proves each hash by building that system's fetch
      # derivation, which needs a builder for the system it names. Emulating
      # aarch64 keeps every architecture in one job, and so in one pull
      # request. A runner without binfmt fails this workflow only: the release
      # and its artifacts are already published by the time it runs.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: extra-platforms = aarch64-linux

      - name: Install the unpacked source hashes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          declared=$(jq -r .version package.json)
          if [ "$version" != "$declared" ]; then
            echo "flake.nix tracks package.json version $declared, not $version" >&2
            exit 1
          fi
          # One system per entry in the flake's srcHashes, each with a release
          # artifact of its own. Keep this list and that attribute set aligned.
          for system in x86_64-linux aarch64-linux; do
            bash scripts/update-flake-hash.sh "$system"
          done

      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: update flake hashes for ${{ inputs.tag }}'
          title: 'chore: update flake hashes for ${{ inputs.tag }}'
          body: |
            Automated update of the `flake.nix` unpacked source hashes for
            release ${{ inputs.tag }}, one per supported architecture, each
            verified by building the fetchzip source.
          branch: flake-hash-${{ inputs.tag }}
          labels: dependencies

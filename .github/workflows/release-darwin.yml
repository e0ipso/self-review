# GitHub Actions Release Pipeline for self-review (macOS)
#
# Triggered by the Linux release workflow after semantic-release creates a new
# tag. Builds a macOS .zip archive and uploads it to the existing GitHub Release.
#
# Dispatching needs `actions: write` on this repository, so the tag input is
# already a privileged value; it is still only ever read through the
# environment and checked against a version shape before anything uses it.
# The build runs with read-only access and hands its archive to a separate
# upload job, which is the only one holding write permission and which
# executes no repository code.

name: Release (macOS)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-darwin-${{ inputs.tag }}
  cancel-in-progress: false

env:
  NO_COLOR: '1'

jobs:
  build:
    name: macOS build
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check the release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to build '$TAG': not a release version tag" >&2
            exit 1
          fi

      # The Linux workflow dispatches this one after creating the release, so
      # the release exists; the wait covers the moments it takes to show up.
      # Checked before the build so a missing release costs no macOS minutes.
      - name: Wait for GitHub Release to exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          for i in $(seq 1 30); do
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "Release $TAG found"
              exit 0
            fi
            echo "Waiting for release $TAG... (attempt $i/30)"
            sleep 10
          done
          echo "Timed out waiting for release $TAG"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - name: Build workspace packages
        run: |
          for pkg in packages/types packages/core packages/react; do
            (cd "$pkg" && npm run build)
          done

      - name: Build macOS package
        run: npm run make

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-darwin
          path: out/make/zip/darwin/*/*.zip
          if-no-files-found: error
          retention-days: 1

  upload:
    name: Upload macOS assets
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      # No checkout: this job uploads what `build` produced and nothing else.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-darwin
          path: darwin

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          mapfile -t assets < <(find darwin -type f -name '*.zip' | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No macOS archive to upload" >&2
            exit 1
          fi
          printf 'Uploading %s\n' "${assets[@]}" >&2
          gh release upload "$TAG" "${assets[@]}" --clobber

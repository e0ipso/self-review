# GitHub Actions Release Pipeline for self-review (macOS)
#
# Triggered by the Linux release workflow after semantic-release creates a new
# tag. Builds a macOS .zip archive and uploads it to the existing GitHub Release.
#
# Dispatching needs `actions: write` on this repository, so the tag input is
# already a privileged value; it is still only ever read through the
# environment and checked against a version shape before anything uses it.
# The build runs with read-only access and hands its archive to a separate
# upload job, which is the only one holding write permission and which
# executes no repository code.

name: Release (macOS)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-darwin-${{ inputs.tag }}
  cancel-in-progress: false

env:
  NO_COLOR: '1'

jobs:
  build:
    name: macOS build
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - name: Check the release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to build '$TAG': not a release version tag" >&2
            exit 1
          fi

      # The Linux workflow dispatches this one after creating the release, so
      # the release exists; the wait covers the moments it takes to show up.
      # Checked before the build so a missing release costs no macOS minutes.
      - name: Wait for GitHub Release to exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          for i in $(seq 1 30); do
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "Release $TAG found"
              exit 0
            fi
            echo "Waiting for release $TAG... (attempt $i/30)"
            sleep 10
          done
          echo "Timed out waiting for release $TAG"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Require Apple release credentials
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required release credential: $name" >&2
              exit 1
            fi
          done

      - run: npm ci

      - name: Build workspace packages
        run: |
          for pkg in packages/types packages/config packages/core packages/react; do
            (cd "$pkg" && npm run build)
          done

      - name: Import signing certificate into a temporary keychain
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          umask 077
          certificate="$RUNNER_TEMP/self-review-signing.p12"
          keychain="$RUNNER_TEMP/self-review-signing.keychain-db"
          password="$(openssl rand -hex 32)"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          rm -f "$certificate"

      - name: Sign and notarize macOS package
        env:
          SELF_REVIEW_MAC_RELEASE: '1'
          APPLE_SIGNING_KEYCHAIN: ${{ runner.temp }}/self-review-signing.keychain-db
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run make

      - name: Verify the signed and stapled archive contents
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          shopt -s nullglob
          archives=(out/make/zip/darwin/*/*.zip)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No macOS archive to verify" >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            extracted="$(mktemp -d "$RUNNER_TEMP/self-review-verify.XXXXXX")"
            ditto -x -k "$archive" "$extracted"
            apps=("$extracted"/*.app)
            if [ "${#apps[@]}" -ne 1 ]; then
              echo "Expected exactly one application in the archive" >&2
              exit 1
            fi
            codesign --verify --deep --strict --verbose=2 "${apps[0]}"
            codesign --verify -R="anchor apple generic and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\"" "${apps[0]}"
            codesign --display --verbose=4 "${apps[0]}" 2>&1 | grep -q 'flags=.*runtime'
            xcrun stapler validate "${apps[0]}"
            spctl --assess --type execute --verbose=2 "${apps[0]}"
            rm -rf "$extracted"
          done

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/self-review-signing.p12"
          if [ -f "$RUNNER_TEMP/self-review-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/self-review-signing.keychain-db"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-darwin
          path: out/make/zip/darwin/*/*.zip
          if-no-files-found: error
          retention-days: 1

  upload:
    name: Upload macOS assets
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      # No checkout: this job uploads what `build` produced and nothing else.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-darwin
          path: darwin

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          mapfile -t assets < <(find darwin -type f -name '*.zip' | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No macOS archive to upload" >&2
            exit 1
          fi
          printf 'Uploading %s\n' "${assets[@]}" >&2
          gh release upload "$TAG" "${assets[@]}" --clobber
